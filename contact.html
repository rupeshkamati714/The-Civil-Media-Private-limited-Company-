<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Contact | The Civil Media</title><link rel="icon" href="assets/images/logo.jpeg"><link rel="stylesheet" href="assets/css/style.css">
</head>
<body><div id="siteHeader"></div>
<main class="container page-content">
  <div class="page-banner"><span class="eyebrow">GET IN TOUCH</span><h1>Contact The Civil Media</h1><p>For news tips, advertising and general enquiries.</p></div>
  <div class="contact-grid">
    <section class="content-panel"><h2>Contact Information</h2><div id="contactInfo"></div></section>
    <section class="content-panel"><h2>Send a Message</h2>
      <form id="contactForm" class="public-form">
        <label>Name<input id="contactName" required></label>
        <label>Email<input id="contactEmail" type="email" required></label>
        <label>Subject<input id="contactSubject" required></label>
        <label>Message<textarea id="contactMessage" rows="7" required></textarea></label>
        <button class="btn btn-primary" type="submit">Send Message</button>
      </form>
    </section>
  </div>
</main>
<div id="siteFooter"></div><script src="assets/js/app.js"></script>
<script>document.addEventListener("DOMContentLoaded",()=>window.CivilMedia.renderContactPage());</script>
</body></html>
