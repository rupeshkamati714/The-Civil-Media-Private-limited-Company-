<!DOCTYPE html>
<html lang="en">
<head>

<title>Gallery | The Civil Media</title>
<link rel="icon" href="assets/images/logo.jpeg"><link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

document.addEventListener("DOMContentLoaded",()=>window.CivilMedia.renderGalleryPage());
</script>
